openapi: 3.0.3
info:
  title: Face Trajectory Algorithm API
  version: 0.13.0
  description: C++17 activity-isolated algorithm core with Go HTTP transport. Every activity-scoped operation requires explicit
    activity_id and applicable CAS versions plus backend-signed action authorization. Activity creation, user selection and
    monitoring enablement are independent. Only qualified monitoring intake admits sightings; legacy raw bypass routes are
    rejected. Verified UTC comes from fresh challenge-bound external authority proofs, never host wall time alone. Configured
    C++ cleanup prunes the 168-hour rolling window including shared historical snapshots, replay and optional P1 SQLite adapters.
    Deletion is disabled by default; local verification is distinct from backend integration, production deployment and capacity
    acceptance.
x-backend-result-push:
  urlConfiguration: daemon flag push-url
  authorizationConfiguration: FACE_TRAJECTORY_PUSH_AUTHORIZATION environment variable
  payloadSchema: '#/components/schemas/BackendResultEvent'
  delivery: at-least-once within the original retention deadline; receiver must validate scope, versions and deadline before
    durable acceptance
  idempotency: SHA-256 of JSON [activity_id,event_id]
  ordering: FIFO inside each activity; eligible activity heads round-robin; failed activity has independent backoff and cannot
    block another activity
  queueLimits:
    global: 10000
    perActivity: 256
    mutation: Checked only when enqueueing a nonduplicate committed result; quota failure rolls back the whole algorithm transaction
paths:
  /v1/monitoring/persons:
    post:
      operationId: registerMonitoringPerson
      description: Durable, versioned person category and optional same-person templates in one transaction. Categories affect
        scheduling, never recognition thresholds. Templates are added or replaced by ID; omission preserves existing templates.
        Revision reuse requires identical contents and updates use CAS. Explicit current activity_id/config_version/binding_version/monitoring_version
        and signed monitor grant are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/MonitoringPersonRequest'
      responses:
        '200':
          description: Category and all templates committed, or identical historical revision acknowledged.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/MonitoringPersonReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Stale expected revision or conflicting immutable revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      x-authorization-action: monitor
      x-activity-scope: activity
  /v1/monitoring/observe:
    post:
      operationId: observeMonitoringFace
      description: Clock-qualified immutable face intake within one explicit activity/device route. Full compatible activity
        gallery comparison, original transaction receipt and automatic affected trajectory rebuild are atomic. Unknown/unverified/>60s
        camera time, stopped/stale/unbound scope return durable HOLD; over-window input returns minimal EXPIRED. Same activity/source/observation
        ID plus identical content retries without business effects; changed content (including reconsider context) is 409.
        Ordinary receipts may later be compacted to remove expired dependent history. Nominal capture more than 60000 ms into
        the future of trusted UTC is HOLD with the fixed first-quarantine deadline; equality at 60000 ms is allowed. Old offline
        captures keep their original capture deadline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityEventScope'
              - $ref: '#/components/schemas/MonitoringObserveRequest'
      responses:
        '200':
          description: Atomic accepted observation or durable HOLD, including original retry receipt.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/MonitoringObserveReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Conflicting observation ID or unapproved change to intake context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      x-authorization-action: ingest
      x-activity-scope: activity
  /v1/monitoring/gate-event:
    post:
      operationId: recordMonitoringGateEvent
      description: 'Immutable activity-scoped ENTRY/EXIT evidence. Ticket history maps authoritative activity_num to activity_id
        and never proves face identity. Optional same-passage face binding requires source_id/observation_id/evidence_id within
        this activity. Missing identity remains UNBOUND/BINDING_PENDING; no guessed identity. Same event key changed binding/time/content
        is 409. Qualified EXIT affects only this activity and cannot close a later unambiguously newer session; overlapping
        intervals remain ambiguous. Future capture guard and immutable event retry rules are identical to face intake. A still-window
        qualified gate retains its confirmed identity/effect when its referenced face expires: the core freezes the current
        confirmed target and scrubs original face ID/proof details, retaining only irreversible provenance. The gate expires
        on its own original capture deadline.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityEventScope'
              - $ref: '#/components/schemas/MonitoringGateRequest'
      responses:
        '200':
          description: Gate saved; HOLD, UNBOUND, BINDING_PENDING or BOUND.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/MonitoringGateReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Conflicting immutable gate event or binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      x-authorization-action: ingest
      x-activity-scope: activity
  /v1/monitoring/get:
    post:
      operationId: getMonitoringPerson
      description: Replay current qualified managed face evidence and explicitly bound gates for a target. Missing entry still
        starts ACTIVE with UNKNOWN entry. Uncertain ordering remains AMBIGUOUS and continue_monitoring=true. Identity corrections
        move gate effects with the referenced face. Session records are conservative projections and may change after late
        evidence; they are not independently observed entry/exit truth or a permanent fixed count of physical visits. Explicit
        current activity_id/config_version/binding_version/monitoring_version and signed query grant are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - type: object
                required:
                - target_id
                properties:
                  target_id:
                    type: string
                    minLength: 1
      responses:
        '200':
          description: Current class, conservative monitoring status, sessions and complete event groups.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - type: object
                  required:
                  - ok
                  - monitoring
                  properties:
                    ok:
                      type: boolean
                    monitoring:
                      $ref: '#/components/schemas/MonitoringProjection'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '409':
          $ref: '#/components/responses/StateConflict'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      x-authorization-action: query
      x-activity-scope: activity
  /v1/push/status:
    get:
      operationId: getBackendPushStatus
      description: Inspect queuing enablement and pending count. receiver_configured reports URL configuration, not receiver
        availability. Without push-url queued results remain pending. Queries never enqueue backend events. Queue exhaustion
        rejects new push-producing writes with 503.
      responses:
        '200':
          description: Local durable outbox status; not proof of backend business acceptance.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/BackendPushStatusReply'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: push_status
      x-activity-scope: global
  /v1/clocks/profiles:
    post:
      operationId: putCameraClockProfile
      description: Register an immutable camera_id plus profile_version calibration profile. This stores local conversion
        metadata and never sets a server or camera clock. Production diagnostics without verified capture semantics and calibration
        remain unverified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockProfileRequest'
      responses:
        '200':
          description: Profile stored or identical version acknowledged.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/AlgorithmReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: global_config
      x-activity-scope: global
  /v1/clocks/normalize:
    post:
      operationId: normalizeExistingCaptureTime
      description: Normalize an existing raw capture timestamp using the exact registered camera profile. Unknown, unverified,
        expired or ambiguous calibration returns HOLD without UTC_CAPTURE fields. No capture, feature extraction, identity
        association or server write occurs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockNormalizeRequest'
      responses:
        '200':
          description: NORMALIZED result or explicit HOLD with provenance.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ClockNormalizeReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: global_config
      x-activity-scope: global
  /v1/point-graphs:
    post:
      operationId: putCameraPointGraph
      description: Register an immutable general camera connectivity graph against an already registered scene. Every operational
        edge endpoint must resolve to one BOUND_MARKER in that scene and coordinate frame; unresolved or conflicting camera
        locations are rejected as operational edges and remain scene candidates. topology_verified true additionally requires
        every edge travel_time_bound_verified true. Metadata qualifies this graph only; registration does not verify physical
        access onsite.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointGraphRequest'
      responses:
        '200':
          description: Graph stored or identical version acknowledged; reply includes graph_version.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/AlgorithmReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: global_config
      x-activity-scope: global
  /v1/point-graphs/get:
    post:
      operationId: getCameraPointGraph
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointGraphGetRequest'
      responses:
        '200':
          description: Exact registered point graph packet including stored qualification metadata.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/PointGraphReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: global_config
      x-activity-scope: global
  /v1/point-trajectories/rebuild:
    post:
      operationId: rebuildCameraPointTrajectory
      description: 0.13 rejects this legacy raw admission route with SOURCE_CONFLICT/409. Submit camera sightings through
        clock-qualified /v1/monitoring/observe; caller-asserted UTC or raw histories cannot bypass admission. Explicit current
        activity_id/config_version/binding_version/monitoring_version and signed ingest grant are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/PointTrajectoryRebuildRequest'
      responses:
        '409':
          $ref: '#/components/responses/StateConflict'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      deprecated: true
      x-authorization-action: ingest
      x-activity-scope: activity
  /v1/point-trajectories/get:
    post:
      operationId: getCameraPointTrace
      description: Return qualified observed camera events, published position candidates and clock-order uncertainty. Links
        mean observation sequence only; camera mounting coordinates are not measured person footpoints. Explicit current activity_id/config_version/binding_version/monitoring_version
        and signed query grant are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/GetRequest'
      responses:
        '409':
          $ref: '#/components/responses/StateConflict'
        '200':
          description: Camera point trace for the requested snapshot; version zero or omission selects latest.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/PointTraceReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-authorization-action: query
      x-activity-scope: activity
  /v1/point-trajectories/predict:
    post:
      operationId: predictReachableCameraPoints
      description: Return possible cameras and connecting edges after the latest qualified observation candidates, using only
        accepted evidence in the selected snapshot at or before the nominal as_of cutoff. Waiting at cameras is allowed. Output
        is a conservative reachable set, without calibrated probabilities or an exact moving position. Graph qualification
        is loaded from the stored point graph; request fields cannot upgrade topology_verified or topology_is_complete. Use
        an earlier immutable snapshot to test prior knowledge; ingestion-time history is not available. Explicit current activity_id/config_version/binding_version/monitoring_version
        and signed query grant are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/PointPredictionRequest'
      responses:
        '409':
          $ref: '#/components/responses/StateConflict'
        '200':
          description: Reachability candidates, conditional/truncated results or explicit UNKNOWN.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/PointPredictionReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-authorization-action: query
      x-activity-scope: activity
  /v1/point-trajectories/compare:
    post:
      operationId: comparePointPredictionWithNewObservation
      description: Compare a new accepted observation with reachability from an earlier immutable snapshot. The observation
        must be absent from previous_version and accepted in version, with version greater than previous_version. A late observation,
        changed graph, absent prior evidence or incomplete prediction can leave the result UNRESOLVED. An excluded camera
        is INCONSISTENT_WITH_PRIOR_MODEL only for a complete search on a stored verified complete graph. The new observation
        is never discarded by this comparison. The worker derives forecast times from snapshot evidence; only resource and
        horizon options are caller supplied. Explicit current activity_id/config_version/binding_version/monitoring_version
        and signed query grant are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/PointPredictionCompareRequest'
      responses:
        '409':
          $ref: '#/components/responses/StateConflict'
        '200':
          description: Comparison status and prior prediction when available.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/PointPredictionCompareReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-authorization-action: query
      x-activity-scope: activity
  /v1/site-scenes:
    post:
      operationId: putPublishedSiteScene
      description: Register an immutable scene of published camera and site annotations. This does not register a navigation
        graph, identity evidence, or person locations. Local coordinates are metres, with a rigid column-major local-to-ECEF
        matrix.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteSceneRequest'
      responses:
        '200':
          description: Scene stored or identical version acknowledged.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/AlgorithmReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: global_config
      x-activity-scope: global
  /v1/site-scenes/camera-context:
    post:
      operationId: queryCameraSiteContext
      description: Resolve an explicitly namespaced camera reference and return every visible published camera marker and
        nearby site annotation within a 3D radius. Conflicting markers remain AMBIGUOUS_POSITION; nearby polygons are measured
        to their boundary, not classified as containing the camera. BOUND_MARKER is a model annotation, not a confirmed person
        observation or camera FOV.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCameraContextRequest'
      responses:
        '200':
          description: Camera binding, candidates and semantic site context.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/SiteCameraContextReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: global_config
      x-activity-scope: global
  /health:
    get:
      operationId: trajectoryHealth
      responses:
        '200':
          description: Worker is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmReply'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      security: []
  /v1/templates:
    post:
      operationId: addEnrolledFaceTemplate
      description: 'Add an externally verified template to the gallery shared with association. template_id must not start
        with assoc-template: and person_entity_id must not start with auto:. Enrolled person_entity_id is used as the association
        target ID. Explicit current activity_id/config_version/binding_version/monitoring_version and signed identity grant
        are required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/FaceTemplateRequest'
      responses:
        '200':
          description: Template added.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/GalleryReply'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StateConflict'
      x-authorization-action: identity
      x-activity-scope: activity
  /v1/templates/{id}:
    delete:
      operationId: removeEnrolledFaceTemplate
      description: Remove an externally enrolled template. Association-owned templates require attribution correction. Explicit
        current activity_id/config_version/binding_version/monitoring_version and signed identity grant are required.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Template removed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthorizedReply'
                - $ref: '#/components/schemas/ActivityReplyContext'
                - $ref: '#/components/schemas/GalleryReply'
        '400':
