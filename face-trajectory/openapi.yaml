          enum:
          - CONFIRMED_FACE_OBSERVATION_ONLY
        monitoring:
          $ref: '#/components/schemas/MonitoringProjection'
  responses:
    StateConflict:
      description: Version precondition or authoritative source mismatch, or current trajectory needs rebuild after association
        changes. Do not blindly refresh expected_version and resend old input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    InvalidRequest:
      description: Invalid JSON object, evidence, graph, option or query.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    WorkerUnavailable:
      description: C++ algorithm worker unavailable or returned invalid JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    CapacityUnavailable:
      description: Queue, gallery or SQLite capacity reached, or verified UTC proof is unavailable/expired. Preserve immutable
        source/event/content on retry; refresh authority proof as appropriate.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    RequestTimeout:
      description: Caller timed out. A mutation may still commit; retry its exact immutable observation ID/content.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    Unauthorized:
      description: Missing, invalid, expired or untrusted signed backend identity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    Forbidden:
      description: Authenticated identity lacks the requested activity action or subscription context.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
    SubscriptionGone:
      description: Subscription ended or was lost on daemon restart; reopen without changing monitoring lifecycle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorReply'
  securitySchemes:
    BackendSignedBearer:
      type: http
      scheme: bearer
      bearerFormat: base64url(JSON).base64url(Ed25519 signature)
      description: Signature covers exact decoded JSON bytes. Trusted issuer/public keys are startup configuration. Plain
        activity_id or unsigned client_context conveys no authority.
security:
- BackendSignedBearer: []
x-trusted-clock:
  challenge: GET /health
  proofSchema: '#/components/schemas/ClockAuthorityProof'
  proofConfiguration: clock-proof-file
  keysConfiguration: clock-public-key-file
  issuerConfiguration: clock-issuer
  maximumProofMS: 120000
  maximumTotalUncertaintyMS: 1000
x-retention:
  durationMS: 604800000
  cutoff: trusted UTC now - 604800000; nominal capture == cutoff is retained
  defaultDeletionEnabled: false
  unknownP2: at most 168 hours from first verified quarantine receipt; retries/restarts never reset
  unknownLegacyOrP1: immediate expiry when no trustworthy original quarantine deadline exists; no new migration window
  excluded: registered gallery, activities, necessary lifecycle/bindings, backend ticket history and camera recordings
