      description: 0.13 rejects this legacy raw admission route with SOURCE_CONFLICT/409. Submit camera sightings through
        clock-qualified /v1/monitoring/observe; caller-asserted UTC or raw histories cannot bypass admission. Explicit current
        activity_id/config_version/binding_version/monitoring_version and signed ingest grant are required.
      x-authorization-action: ingest
      x-activity-scope: activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ActivityVersions'
              - $ref: '#/components/schemas/ActivityVersions'
      responses:
        '409':
          $ref: '#/components/responses/StateConflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/CapacityUnavailable'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '502':
          $ref: '#/components/responses/WorkerUnavailable'
        '504':
          $ref: '#/components/responses/RequestTimeout'
      deprecated: true
components:
  schemas:
    TrajectoryFreshness:
      type: object
      required:
      - snapshot_association_revision
      - current_association_revision
      - latest_version
      - association_matches_current
      - requested_scope
      - valid_for_current_use
      - status
      properties:
        snapshot_association_revision:
          type: integer
          format: int64
          minimum: 0
        current_association_revision:
          type: integer
          format: int64
          minimum: 0
        latest_version:
          type: integer
          format: int64
          minimum: 0
        association_matches_current:
          type: boolean
        requested_scope:
          type: string
          enum:
          - CURRENT
          - HISTORICAL
        valid_for_current_use:
          type: boolean
          description: Snapshot is the latest head and its association binding is current. Field accuracy and topology acceptance
            remain separate.
        status:
          type: string
          enum:
          - CURRENT
          - HISTORICAL
          - STALE_ASSOCIATION
    AssociationTrajectoryEffect:
      type: object
      required:
      - target_id
      - current_association_revision
      - latest_trajectory_version
      - rebuild_required
      properties:
        target_id:
          type: string
        current_association_revision:
          type: integer
          format: int64
          minimum: 0
        latest_trajectory_version:
          type: integer
          format: int64
          minimum: 0
        rebuild_required:
          type: boolean
    BackendResultEvent:
      type: object
      required:
      - schema_version
      - event_id
      - sequence
      - operation
      - created_at_unix_ms
      - result
      - activity_id
      - activity_num
      - config_version
      - binding_version
      - monitoring_version
      - retention_deadline_unix_ms
      properties:
        schema_version:
          type: string
          enum:
          - '1'
        event_id:
          type: string
          description: Stable per delivery retry; receiver deduplicates (activity_id,event_id). Idempotency-Key is SHA-256
            of canonical JSON [activity_id,event_id].
        sequence:
          type: integer
          format: int64
          minimum: 1
        operation:
          type: string
          enum:
          - association_observe
          - association_correct
          - association_rebuild
          - trajectory_rebuild
          - point_trajectory_rebuild
          - monitoring_observe
          - monitoring_gate_event
          - monitoring_person_put
        created_at_unix_ms:
          type: integer
          format: int64
          description: Verified UTC enqueue time, never camera capture time or a retention reset.
        result:
          $ref: '#/components/schemas/AlgorithmReply'
        activity_id:
          type: string
          minLength: 1
          maxLength: 1024
        activity_num:
          type: string
          minLength: 1
          maxLength: 1024
        config_version:
          type: integer
          format: int64
          minimum: 0
        binding_version:
          type: integer
          format: int64
          minimum: 0
        monitoring_version:
          type: integer
          format: int64
          minimum: 0
        retention_deadline_unix_ms:
          type: integer
          format: int64
      description: Committed original result, compacted when dependent historical evidence expires. Receiver independently
        rejects delivery after retention_deadline_unix_ms and applies activity/version-aware updates. No input image, embedding
        or credentials are attached.
    BackendPushStatusReply:
      type: object
      required:
      - ok
      - push
      properties:
        ok:
          type: boolean
        push:
          type: object
          required:
          - enabled
          - durable
          - pending
          - max_pending
          - receiver_configured
          properties:
            enabled:
              type: boolean
              description: Result queuing is enabled for new writes.
            durable:
              type: boolean
            pending:
              type: integer
              minimum: 0
            max_pending:
              type: integer
              enum:
              - 10000
            receiver_configured:
              type: boolean
            max_pending_per_activity:
              type: integer
              enum:
              - 256
              description: Per-activity durable result quota; separate from the global maximum
    MonitoringPersonRequest:
      type: object
      required:
      - person_id
      - category
      - revision
      - expected_revision
      - evidence_id
      properties:
        person_id:
          type: string
          minLength: 1
          maxLength: 1024
        category:
          type: string
          enum:
          - PRIORITY
          - NORMAL
          - UNREGISTERED
        revision:
          type: integer
          format: int64
          minimum: 1
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        evidence_id:
          type: string
          minLength: 1
          maxLength: 1024
        templates:
          type: array
          maxItems: 64
          items:
            type: object
            required:
            - template_id
            - feature_space
            - embedding
            properties:
              template_id:
                type: string
                minLength: 1
                maxLength: 1024
              feature_space:
                $ref: '#/components/schemas/FeatureSpaceContract'
              embedding:
                $ref: '#/components/schemas/FaceObservation/properties/embedding'
    MonitoringPersonReply:
      type: object
      required:
      - ok
      - person
      - submitted_revision
      - duplicate
      - gallery_version
      properties:
        ok:
          type: boolean
        person:
          type: object
          required:
          - person_id
          - category
          - revision
          - evidence_id
          properties:
            person_id:
              type: string
            category:
              type: string
              enum:
              - PRIORITY
              - NORMAL
              - UNREGISTERED
            revision:
              type: integer
              format: int64
              minimum: 0
            evidence_id:
              type: string
              nullable: true
        submitted_revision:
          type: integer
          format: int64
          minimum: 1
        duplicate:
          type: boolean
        gallery_version:
          type: integer
          format: int64
          minimum: 0
    MonitoringTimeRecord:
      type: object
      nullable: true
      description: Missing, null or incomplete evidence produces durable HOLD; registered profile is camera-specific.
      properties:
        profile_version:
          type: string
        camera_id:
          type: string
          description: Required for gates; taken from the face observation for observe.
        source_id:
          type: string
          description: If supplied for observe, must match the observation source.
        raw_time:
          type: string
        time_policy:
          type: string
          enum:
          - CAMERA_CAPTURE_60S
          default: CAMERA_CAPTURE_60S
    MonitoringFaceObservation:
      type: object
      required:
      - observation_id
      - source_id
      - camera_id
      - frame_id
      - feature_space
      - embedding
      - detection_score
      - face_size_px
      description: Image extraction is performed by P1. Use actual original image/frame pixel dimensions. All fields in this
        object remain immutable across retries and evidence reconsideration. Existing normalized clock fields, if present,
        do not override the time_record adapter.
      properties:
        observation_id:
          type: string
          minLength: 1
          maxLength: 1024
        source_id:
          type: string
          minLength: 1
        camera_id:
          type: string
          minLength: 1
        frame_id:
          type: string
          minLength: 1
        feature_space:
          $ref: '#/components/schemas/FeatureSpaceContract'
        embedding:
          $ref: '#/components/schemas/FaceObservation/properties/embedding'
        detection_score:
          type: number
          minimum: 0
          maximum: 1
        face_size_px:
          type: number
          minimum: 0
          exclusiveMinimum: true
        local_track_id:
          type: string
        track_session_id:
          type: string
        reentry_evidence_id:
          type: string
    MonitoringAssociationPolicy:
      allOf:
      - $ref: '#/components/schemas/AssociationPolicy'
      - type: object
        properties:
          max_clock_uncertainty_ms:
            type: integer
            format: int64
            minimum: 0
            maximum: 60000
            default: 60000
    MonitoringObserveRequest:
      type: object
      required:
      - observation
      - policy
      - graph
      properties:
        observation:
          $ref: '#/components/schemas/MonitoringFaceObservation'
        time_record:
          $ref: '#/components/schemas/MonitoringTimeRecord'
        policy:
          $ref: '#/components/schemas/MonitoringAssociationPolicy'
        graph:
          $ref: '#/components/schemas/CameraGraph'
        options:
          $ref: '#/components/schemas/PointTrajectoryOptions'
        reconsider:
          type: boolean
          default: false
        evidence_id:
          type: string
          description: Required independent provenance for reconsidering held time/policy context.
      description: All original event content including activity versions, route, face, clock context and gate binding is
        immutable for the same activity/source/event key. Any changed retry is 409. reconsider is a reserved legacy field
        and does not authorize changed content in 0.13.
    MonitoringTrajectoryReference:
      type: object
      required:
      - revision
      - target_id
      - version
      - association_revision
      - observation_count
      - anchor_count
      - graph_version
      - detail_query
      properties:
        revision:
          $ref: '#/components/schemas/TrajectoryRevision'
        target_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        association_revision:
          type: integer
          format: int64
          minimum: 0
        observation_count:
          type: integer
          minimum: 0
        anchor_count:
          type: integer
          minimum: 0
        graph_version:
          type: string
        detail_query:
          type: string
          enum:
          - POST /v1/trajectories/get
    MonitoringProjection:
      type: object
      required:
      - target_id
      - category
      - person_revision
      - association_revision
      - gate_revision
      - status
      - entry_status
      - continue_monitoring
      - possible_statuses
      properties:
        target_id:
          type: string
        category:
          type: string
          enum:
          - PRIORITY
          - NORMAL
          - UNREGISTERED
        person_revision:
          type: integer
          format: int64
          minimum: 0
        association_revision:
          type: integer
          format: int64
          minimum: 0
        gate_revision:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum:
          - NOT_STARTED
          - ACTIVE
          - CLOSED
          - AMBIGUOUS
        entry_status:
          type: string
          enum:
          - KNOWN
          - UNKNOWN
        continue_monitoring:
          type: boolean
        possible_statuses:
          type: array
          items:
            type: string
            enum:
            - NOT_STARTED
            - ACTIVE
            - CLOSED
        current_session_id:
          type: string
          nullable: true
          description: Present in compact intake replies.
        session_record_count:
          type: integer
          minimum: 0
          description: Conservative projected records, not a guaranteed physical visit count.
        event_group_count:
          type: integer
          minimum: 0
        sessions:
          type: array
          description: Complete projection returned by get, omitted from compact intake receipts.
          items:
            type: object
        event_groups:
          type: array
          description: Interval-connected groups retain explicit order ambiguity and original evidence references.
          items:
            type: object
        ignored_unqualified_gate_events:
          type: array
          items:
            type: string
        detail_query:
          type: string
          enum:
          - POST /v1/monitoring/get
        session_scope:
          type: string
    MonitoringObserveReply:
      anyOf:
      - $ref: '#/components/schemas/QualifiedMonitoringObserveReply'
      - $ref: '#/components/schemas/HeldOrExpiredIntakeReply'
      - $ref: '#/components/schemas/CompactIntakeReceipt'
    MonitoringGateRequest:
      type: object
      required:
      - event_id
      - source_id
      - gate_id
      - direction
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 1024
        source_id:
          type: string
          minLength: 1
          maxLength: 1024
        gate_id:
          type: string
          minLength: 1
          maxLength: 1024
        direction:
          type: string
          enum:
          - ENTRY
          - EXIT
        ticket_reference:
          type: string
        time_record:
          $ref: '#/components/schemas/MonitoringTimeRecord'
        binding:
          type: object
          nullable: true
          required:
          - observation_id
          - evidence_id
          - source_id
          properties:
            observation_id:
              type: string
              minLength: 1
              maxLength: 1024
            evidence_id:
              type: string
              minLength: 1
              maxLength: 1024
            source_id:
              type: string
              minLength: 1
              maxLength: 1024
            activity_id:
              type: string
              minLength: 1
              maxLength: 1024
        reconsider:
          type: boolean
          default: false
        evidence_id:
          type: string
          description: Independent evidence when explicitly reconsidering a held gate clock context.
      description: All original event content including activity versions, route, face, clock context and gate binding is
        immutable for the same activity/source/event key. Any changed retry is 409. reconsider is a reserved legacy field
        and does not authorize changed content in 0.13.
    MonitoringGateReply:
      anyOf:
      - $ref: '#/components/schemas/QualifiedMonitoringGateReply'
      - $ref: '#/components/schemas/HeldOrExpiredIntakeReply'
      - $ref: '#/components/schemas/CompactIntakeReceipt'
    ClockProfileRequest:
      type: object
      required:
      - profile
      properties:
        profile:
          $ref: '#/components/schemas/ClockProfile'
    ClockProfile:
      type: object
      required:
      - profile_version
      - camera_id
      - verified
      - source_evidence_id
      - capture_semantics
      - calibrations
      description: Immutable per-camera calibration. verified true requires DEVICE_CAPTURE semantics and at least one calibration.
        Unverified profiles may retain an empty calibration array and always normalize to HOLD. A new source or changed calibration
        requires a new profile_version.
      properties:
        profile_version:
          type: string
          minLength: 1
        camera_id:
          type: string
          minLength: 1
        verified:
          type: boolean
        source_evidence_id:
          type: string
          minLength: 1
        capture_semantics:
          type: string
          enum:
          - DEVICE_CAPTURE
          - UNKNOWN
        fixed_utc_offset_minutes:
          type: integer
          minimum: -840
          maximum: 840
          description: Required only to interpret a naive raw timestamp; never applied again to a timestamp with explicit
            UTC offset.
        calibrations:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/ClockCalibration'
    ClockCalibration:
      type: object
      required:
      - calibration_id
      - source_evidence_id
      - valid_from_utc_ms
      - valid_until_utc_ms
      - offset_ms
      - uncertainty_ms
      - time_resolution_ms
      description: Unique calibration ID within the profile. Validity is a nonempty half-open corrected-UTC interval [from,until);
        declared intervals must not overlap. The entire corrected uncertainty interval must fit within validity. Different
        offset periods that explain the same raw time return ambiguous HOLD.
      properties:
        calibration_id:
          type: string
          minLength: 1
        source_evidence_id:
          type: string
          minLength: 1
        valid_from_utc_ms:
          type: integer
          format: int64
        valid_until_utc_ms:
          type: integer
          format: int64
        offset_ms:
          type: integer
          format: int64
          description: Positive means camera ahead; corrected UTC equals parsed device UTC minus offset_ms.
        uncertainty_ms:
          type: integer
          format: int64
          minimum: 0
          description: Calibration error bound covering the declared validity period, including drift and calibration measurement
            error.
        time_resolution_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
    ClockNormalizeRequest:
      type: object
      required:
      - profile_version
      - camera_id
      - raw_time
      properties:
        time_policy:
          type: string
          enum:
          - CORRECTED_UTC
          - CAMERA_CAPTURE_60S
          default: CORRECTED_UTC
          description: Standalone legacy normalization defaults to corrected UTC. Point trajectory rebuild always uses CAMERA_CAPTURE_60S
            regardless of caller overrides.
        profile_version:
          type: string
          minLength: 1
        camera_id:
          type: string
          minLength: 1
        raw_time:
          type: string
          minLength: 1
          description: Existing capture timestamp YYYY-MM-DDTHH:mm:ss with optional 1-3 fractional digits and Z or explicit
            +/-HH:MM offset. A space may replace T. Naive timestamps require the configured fixed offset. Unknown -00:00,
            invalid Gregorian dates, leap seconds and greater-than-millisecond fractions yield HOLD. Signed epoch times before
            1970 are supported.
          example: '2026-10-07T10:00:48.123+08:00'
    ClockNormalization:
      type: object
      required:
      - status
      - reason_codes
      - provenance
      description: Only NORMALIZED includes captured_at_unix_ms, clock_uncertainty_ms, time_source and clock_domain. HOLD
        omits those fields. Final error equals calibration uncertainty plus max(configured resolution, input text resolution)
        minus one millisecond in CORRECTED_UTC mode. CAMERA_CAPTURE_60S keeps the parsed camera timestamp and adds absolute
        offset to that error; a total above 60000ms yields HOLD with CAMERA_CLOCK_ERROR_EXCEEDS_60S. Normalization does not
        establish identity or satisfy a trajectory's possibly stricter maximum clock error automatically.
      properties:
        status:
          type: string
          enum:
          - NORMALIZED
          - HOLD
        reason_codes:
          type: array
          items:
            type: string
        captured_at_unix_ms:
          type: integer
          format: int64
        clock_uncertainty_ms:
          type: integer
          format: int64
          minimum: 0
        time_source:
          type: string
          enum:
          - UTC_CAPTURE
        clock_domain:
          type: string
          enum:
          - UTC
        provenance:
          type: object
          required:
          - camera_id
          - profile_version
          - raw_time
          - offset_convention
          properties:
            camera_id:
              type: string
            profile_version:
              type: string
            raw_time:
              type: string
            offset_convention:
              type: string
              enum:
              - POSITIVE_CAMERA_AHEAD
            time_policy:
              type: string
              enum:
              - CORRECTED_UTC
              - CAMERA_CAPTURE_60S
            applied_offset_ms:
              type: integer
              format: int64
            max_device_time_error_ms:
              type: integer
              enum:
              - 60000
            device_time_error_bound_ms:
              type: integer
              format: int64
              minimum: 0
              maximum: 60000
            profile_source_evidence_id:
              type: string
            profile_verified:
              type: boolean
            capture_semantics:
              type: string
              enum:
              - DEVICE_CAPTURE
              - UNKNOWN
            timezone_source:
              type: string
              enum:
              - EXPLICIT_TIMESTAMP_OFFSET
              - PROFILE_FIXED_OFFSET
            timezone_offset_minutes:
              type: integer
            device_utc_unix_ms:
              type: integer
              format: int64
            text_resolution_ms:
              type: integer
            calibration_id:
              type: string
            calibration_source_evidence_id:
              type: string
            offset_ms:
              type: integer
              format: int64
            calibration_uncertainty_ms:
              type: integer
              format: int64
              minimum: 0
            configured_time_resolution_ms:
              type: integer
              format: int64
              minimum: 1
            valid_from_utc_ms:
              type: integer
              format: int64
            valid_until_utc_ms:
              type: integer
              format: int64
            parse_error:
              type: string
    ClockNormalizeReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - normalization
        properties:
          normalization:
            $ref: '#/components/schemas/ClockNormalization'
    PointGraphRequest:
      type: object
      required:
      - point_graph
      properties:
        point_graph:
          $ref: '#/components/schemas/PointGraph'
    PointGraphGetRequest:
      type: object
      required:
      - graph_version
      properties:
        graph_version:
          type: string
          minLength: 1
    PointGraph:
      type: object
      required:
      - graph_version
      - scene_version
      - source_evidence_id
      - coordinate_frame
      - topology_verified
      - topology_is_complete
      - edges
      description: General directed camera-point topology, independent of any requested person route. Scene version and coordinate
        frame must match a registered site scene. Edge order is canonicalized by stable edge_id. Reusing a graph_version with
        different packet contents is rejected. Scene conflicts remain available as position candidates and cannot be silently
        resolved by adding operational edges. Any supplied unit, transform, model metadata, camera positions and edge annotation
        bindings are checked against that immutable scene. The camera-point-candidate-graph@1 schema requires unit, to_world_matrix,
        all bound cameras with their complete source position_candidates, and edge source annotation IDs. A model candidate
        packet targeting a scene with model_revision also requires model_binding. Legacy minimal graphs may omit model provenance;
        acceptance does not verify external model content.
      properties:
        graph_version:
          type: string
          minLength: 1
        scene_version:
          type: string
          minLength: 1
        source_evidence_id:
          type: string
          minLength: 1
        coordinate_frame:
          type: string
          minLength: 1
        schema:
          type: string
          description: camera-point-candidate-graph@1 enables required model spatial binding checks.
        unit:
          type: string
          enum:
          - m
        to_world_matrix:
          type: array
          minItems: 16
          maxItems: 16
          items:
            type: number
          description: Must equal the registered scene transform when supplied.
        model_binding:
          type: object
          required:
          - model_id
          - scene_url
          - tileset_id
          - calibration_profile
          description: Source metadata must match the registered scene exactly. model_revision must be present iff it exists
            on the scene. This checks declared provenance, not remote files or actual 3D content.
          properties:
            model_id:
              type: string
              minLength: 1
            scene_url:
              type: string
              minLength: 1
            tileset_id:
              type: string
              minLength: 1
            calibration_profile:
              type: string
              minLength: 1
            model_revision:
              type: string
              minLength: 1
        cameras:
          type: array
          description: Supplied camera IDs, channel bindings and source positions must agree with the scene; model candidate
            packets preserve all bound cameras and all conflicting markers.
          items:
            type: object
            required:
            - camera_id
            properties:
              camera_id:
                type: string
                minLength: 1
              position_candidates:
                type: array
                items:
                  type: object
                  required:
                  - annotation_id
                  description: Requires points or local_xyz matching the source annotation. Model candidate packets require
                    the full source spatial binding fields.
                  properties:
                    annotation_id:
                      type: string
                      minLength: 1
                    local_xyz:
                      $ref: '#/components/schemas/SiteXYZ'
                    points:
                      type: array
                      minItems: 1
                      maxItems: 1
                      items:
                        $ref: '#/components/schemas/SiteXYZ'
        topology_verified:
          type: boolean
          description: Explicit stored qualification; true requires verified time bounds on every edge.
        topology_is_complete:
          type: boolean
          description: Explicit stored assertion of graph coverage; incomplete graphs cannot justify exclusion of all other
            locations.
        edges:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/CameraEdge'
            - type: object
              properties:
                travel_time_bound_verified:
                  type: boolean
                  default: false
                from_annotation_id:
                  type: string
                  minLength: 1
                  description: Must identify a source CAMERA annotation bound to from_camera.
                to_annotation_id:
                  type: string
                  minLength: 1
                  description: Must identify a source CAMERA annotation bound to to_camera.
      additionalProperties: true
    PointGraphReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - point_graph
        properties:
          point_graph:
            $ref: '#/components/schemas/PointGraph'
    RawCameraPassageRecord:
      type: object
      required:
      - observation_id
      - camera_id
      - source_id
      - link_status
      - attribution_evidence_id
      - clock_profile_version
      - raw_time
      description: Reuses existing identity linkage and capture data. Only CONFIRMED with nonempty attribution evidence can
        be admitted. target_id, when supplied, must equal the rebuild target. Duplicate observation IDs must have identical
        complete contents. No face crop or embedding is required.
      properties:
        observation_id:
          type: string
          minLength: 1
        target_id:
          type: string
          minLength: 1
        camera_id:
          type: string
          minLength: 1
        source_id:
          type: string
          minLength: 1
        link_status:
          type: string
          enum:
          - CONFIRMED
          - PROVISIONAL
          - UNASSIGNED
          - CONFLICT
        attribution_evidence_id:
          type: string
        clock_profile_version:
          type: string
          minLength: 1
        raw_time:
          type: string
          minLength: 1
        reentry_evidence_id:
          type: string
    PointTrajectoryRebuildRequest:
      type: object
      required:
      - target_id
      - graph_version
      - records
      - reason
      description: 'Complete authoritative rebuild. Always uses CAMERA_CAPTURE_60S: nominal device capture time, verified
        total error at most 60000ms, otherwise HOLD. Options default to 60000ms here and may only tighten that limit. Existing
        corrected-time histories require explicit authoritative replay.'
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: 'Optimistic precondition: 0 for creation; current trajectory version for a changed rebuild. Omission
            on an existing changed target returns 409. An identical current-input retry may use an older expected version.'
        target_id:
          type: string
          minLength: 1
        graph_version:
          type: string
          minLength: 1
        records:
          type: array
          description: COMPLETE authoritative evidence set for this target; held and omitted records are absent from the new
            snapshot.
          items:
            $ref: '#/components/schemas/RawCameraPassageRecord'
        reason:
          type: string
          minLength: 1
        options:
          $ref: '#/components/schemas/PointTrajectoryOptions'
    PointTrajectoryOptions:
      type: object
      properties:
        max_clock_uncertainty_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 60000
          default: 60000
        max_visit_gap_ms:
          $ref: '#/components/schemas/TrajectoryOptions/properties/max_visit_gap_ms'
        session_gap_ms:
          $ref: '#/components/schemas/TrajectoryOptions/properties/session_gap_ms'
        max_hops:
          $ref: '#/components/schemas/TrajectoryOptions/properties/max_hops'
        max_expansions:
          $ref: '#/components/schemas/TrajectoryOptions/properties/max_expansions'
        max_candidates:
          $ref: '#/components/schemas/TrajectoryOptions/properties/max_candidates'
        backup_score_margin:
          $ref: '#/components/schemas/TrajectoryOptions/properties/backup_score_margin'
        travel_time_weight_per_second:
          $ref: '#/components/schemas/TrajectoryOptions/properties/travel_time_weight_per_second'
        non_overlapping_cameras:
          $ref: '#/components/schemas/TrajectoryOptions/properties/non_overlapping_cameras'
    PointRecordAdmission:
      type: object
      required:
      - observation_id
      - status
      - reason_codes
      properties:
        observation_id:
          type: string
        status:
          type: string
          enum:
          - ACCEPTED
          - HOLD
        reason_codes:
          type: array
          items:
            type: string
        normalization:
          $ref: '#/components/schemas/ClockNormalization'
        sighting:
          $ref: '#/components/schemas/Sighting'
    PointTrace:
      type: object
      required:
      - target_id
      - version
      - scene_version
      - graph_version
      - coordinate_frame
      - topology_verified
      - topology_is_complete
      - observations
      - observation_order
      - drawing_mode
      - connections
      - detailed_walk_path_observed
      properties:
        freshness:
          $ref: '#/components/schemas/TrajectoryFreshness'
        target_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        scene_version:
          type: string
        graph_version:
          type: string
        coordinate_frame:
          type: string
        topology_verified:
          type: boolean
        topology_is_complete:
          type: boolean
        detailed_walk_path_observed:
          type: boolean
          enum:
          - false
        drawing_mode:
          type: string
          enum: [CAMERA_POINT_CONNECTIONS]
        connections:
          type: array
          description: Direct nominal observation-sequence connections between different camera markers. Repeated same-camera
            observations produce no self-loop. Separate sessions and missing or multiple marker positions are not drawable.
            Clock-overlap groups retain uncertain order. Display chords never represent inferred walking routes.
          items:
            $ref: '#/components/schemas/CameraPointConnection'
        observations:
          type: array
          items:
            type: object
            required:
            - observation_id
            - camera_id
            - captured_at_unix_ms
            - clock_uncertainty_ms
            - attribution_evidence_id
            - status
            - position_status
            - position_candidates
            - position_semantics
            - source_id
            properties:
              observation_id:
                type: string
              camera_id:
                type: string
              captured_at_unix_ms:
                type: integer
                format: int64
              clock_uncertainty_ms:
                type: integer
                format: int64
                minimum: 0
              attribution_evidence_id:
                type: string
              status:
                type: string
                enum:
                - OBSERVED
              position_status:
                type: string
                description: Published camera binding status; conflicts retain all candidates.
              position_semantics:
                type: string
                enum:
                - CAMERA_MARKER_NOT_PERSON_FOOTPOINT
              source_id:
                type: string
              position_candidates:
                type: array
                items:
                  type: object
                  required:
                  - annotation_id
                  - source_scene_id
                  - name
                  - local_xyz
                  properties:
                    annotation_id:
                      type: string
                    source_scene_id:
                      type: string
                    name:
                      type: string
                    local_xyz:
                      type: array
                      minItems: 3
                      maxItems: 3
                      items:
                        type: number
        observation_order:
          type: array
          items:
            type: object
            required:
            - from_observation_id
            - to_observation_id
            - order_status
            - physical_path_observed
            - meaning
            properties:
              from_observation_id:
                type: string
              to_observation_id:
                type: string
              order_status:
                type: string
                enum:
                - ORDERED
                - UNCERTAIN_CLOCK_ORDER
              physical_path_observed:
                type: boolean
                enum:
                - false
              meaning:
                type: string
                enum:
                - OBSERVATION_SEQUENCE_ONLY
    CameraPointConnection:
      type: object
      oneOf:
      - properties:
          drawing_status:
            enum: [DRAWABLE]
          coordinates:
            minItems: 2
            maxItems: 2
      - properties:
          drawing_status:
            enum: [UNRESOLVED_POSITION, SESSION_BREAK]
          coordinates:
            maxItems: 0
      required: [from_observation_id, to_observation_id, from_source_id, to_source_id, from_camera_id, to_camera_id, order_status, drawing_status,
        coordinates, physical_path_observed, meaning]
      properties:
        from_observation_id:
          type: string
        to_observation_id:
          type: string
        from_source_id:
          type: string
        to_source_id:
          type: string
        from_camera_id:
          type: string
        to_camera_id:
          type: string
        order_status:
          type: string
          enum: [ORDERED, UNCERTAIN_CLOCK_ORDER]
        drawing_status:
          type: string
          enum: [DRAWABLE, UNRESOLVED_POSITION, SESSION_BREAK]
        coordinates:
          type: array
          maxItems: 2
          description: Exactly two local xyz endpoints for DRAWABLE; empty otherwise. Uses PointTrace.coordinate_frame.
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
        physical_path_observed:
          type: boolean
          enum: [false]
        meaning:
          type: string
          enum: [DIRECT_CAMERA_POINT_CONNECTION]
    PointTraceReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - point_trace
        properties:
          point_trace:
            $ref: '#/components/schemas/PointTrace'
    PointTrajectoryRebuildReply:
      allOf:
      - $ref: '#/components/schemas/TrajectoryReply'
      - type: object
        required:
        - revision
        - trajectory
        - admissions
        - point_trace
        properties:
          admissions:
            type: array
            items:
              $ref: '#/components/schemas/PointRecordAdmission'
          point_trace:
            $ref: '#/components/schemas/PointTrace'
    PointPredictionLimits:
      type: object
      description: Resource and horizon limits; topology qualification always comes from the registered graph.
      properties:
        max_horizon_ms:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400000
          default: 300000
        max_expansions:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 10000
        max_candidates:
          type: integer
          minimum: 1
          maximum: 100000
          default: 10000
        max_graph_edges:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        max_evidence:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
        allow_edge_wait:
          type: boolean
          default: true
          description: Allow staying on a traversed edge; waiting at cameras is always allowed. False applies max_travel_ms
            as an edge occupancy bound.
    PointPredictionOptions:
      allOf:
      - $ref: '#/components/schemas/PointPredictionLimits'
      - type: object
        required:
        - as_of_unix_ms
        - at_unix_ms
        properties:
          as_of_unix_ms:
            type: integer
            format: int64
            description: Nominal capture cutoff within the explicitly selected snapshot, not a historical ingestion-time query.
          at_unix_ms:
            type: integer
            format: int64
            description: Requested forecast time; must be at or after as_of_unix_ms and within the horizon from possible latest
              capture.
    PointPredictionRequest:
      allOf:
      - $ref: '#/components/schemas/GetRequest'
      - type: object
        required:
        - prediction
        properties:
          prediction:
            $ref: '#/components/schemas/PointPredictionOptions'
    PointPrediction:
      type: object
      required:
      - target_id
      - version
      - graph_version
      - as_of_unix_ms
      - at_unix_ms
      - status
      - reason
      - search_complete
      - coverage_complete
      - topology_verified
      - topology_is_complete
      - candidate_cameras
      - candidate_edges
      - based_on_observation_ids
      - latest_observation_candidates
      properties:
        freshness:
          $ref: '#/components/schemas/TrajectoryFreshness'
        target_id:
          type: string
        version:
          type: integer
          format: int64
        graph_version:
          type: string
        as_of_unix_ms:
          type: integer
          format: int64
        at_unix_ms:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - UNKNOWN
          - CANDIDATE
          - CONDITIONAL_CANDIDATE
          - TRUNCATED
        reason:
          type: string
        search_complete:
          type: boolean
        coverage_complete:
          type: boolean
        topology_verified:
          type: boolean
        topology_is_complete:
          type: boolean
        waiting_at_camera_allowed:
          type: boolean
          enum:
          - true
        allow_edge_wait:
          type: boolean
        has_calibrated_probabilities:
          type: boolean
          enum:
          - false
        point_position_estimated:
          type: boolean
          enum:
          - false
        knowledge_basis:
          type: string
          enum:
          - SNAPSHOT_VERSION_AND_NOMINAL_CAPTURE_CUTOFF
        ingestion_time_history_available:
          type: boolean
          enum:
          - false
        max_horizon_ms:
          type: integer
          format: int64
        expansions:
          type: integer
          minimum: 0
        based_on_observation_ids:
          type: array
          items:
            type: string
        excluded_future_observation_count:
          type: integer
          minimum: 0
        origins_without_graph_edges:
          type: array
          items:
            type: string
        candidate_cameras:
          type: array
          items:
            type: object
            required:
            - camera_id
            - earliest_arrival_unix_ms
            properties:
              camera_id:
                type: string
              earliest_arrival_unix_ms:
                type: integer
                format: int64
        candidate_edges:
          type: array
          items:
            type: object
            required:
            - edge_id
            - from_camera
            - to_camera
            - earliest_departure_unix_ms
            - latest_departure_unix_ms
            - possible_at_unix_ms
            properties:
              edge_id:
                type: string
              from_camera:
                type: string
              to_camera:
                type: string
              earliest_departure_unix_ms:
                type: integer
                format: int64
              latest_departure_unix_ms:
                type: integer
                format: int64
              possible_at_unix_ms:
                type: integer
                format: int64
        latest_observation_candidates:
          type: array
          items:
            type: object
            required:
            - observation_id
            - camera_id
            - captured_at_unix_ms
            - earliest_unix_ms
            - latest_unix_ms
            properties:
              observation_id:
                type: string
              camera_id:
                type: string
              captured_at_unix_ms:
                type: integer
                format: int64
              earliest_unix_ms:
                type: integer
                format: int64
              latest_unix_ms:
                type: integer
                format: int64
      additionalProperties: true
    PointPredictionReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - prediction
        properties:
          prediction:
            $ref: '#/components/schemas/PointPrediction'
    PointPredictionCompareRequest:
      type: object
      required:
      - target_id
      - previous_version
      - version
      - observation_id
      properties:
        target_id:
          type: string
          minLength: 1
        previous_version:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 2
          description: Must be strictly greater than previous_version.
        observation_id:
          type: string
          minLength: 1
        prediction:
          $ref: '#/components/schemas/PointPredictionLimits'
    PointPredictionCompareReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - comparison
        properties:
          comparison:
            type: object
            required:
            - previous_version
            - version
            - observation_id
            - observed_camera_id
            - status
            - observation_discarded
            properties:
              freshness:
                $ref: '#/components/schemas/TrajectoryFreshness'
              previous_version:
                type: integer
                format: int64
              version:
                type: integer
                format: int64
              observation_id:
                type: string
              observed_camera_id:
                type: string
              status:
                type: string
                enum:
                - UNRESOLVED
                - CONSISTENT_WITH_PRIOR_CANDIDATES
                - INCONSISTENT_WITH_PRIOR_MODEL
              reason:
                type: string
              observation_discarded:
                type: boolean
                enum:
                - false
              prior_prediction:
                $ref: '#/components/schemas/PointPrediction'
    SiteSceneRequest:
      type: object
      required:
      - site
      properties:
        site:
          $ref: '#/components/schemas/SiteScene'
    SiteScene:
      type: object
      required:
      - scene_version
      - model_id
      - scene_url
      - tileset_id
      - calibration_profile
      - coordinate_frame
      - world_coordinate_frame
      - unit
      - source_evidence_id
      - to_world_matrix
      - duplicate_tolerance_m
      - cameras
      - annotations
      properties:
        scene_version:
          type: string
          minLength: 1
        model_id:
          type: string
          minLength: 1
        model_revision:
          type: string
          minLength: 1
          description: Optional externally supplied model evidence identifier; not proof that remote 3D asset content has
            been verified.
        scene_url:
          type: string
          minLength: 1
        tileset_id:
          type: string
          minLength: 1
        calibration_profile:
          type: string
          minLength: 1
        coordinate_frame:
          type: string
          minLength: 1
        world_coordinate_frame:
          type: string
          enum:
          - ECEF_WGS84
        unit:
          type: string
          enum:
          - m
        source_evidence_id:
          type: string
          minLength: 1
        to_world_matrix:
          type: array
          minItems: 16
          maxItems: 16
          items:
            type: number
          description: Column-major rigid affine transform from local metres to ECEF metres.
        duplicate_tolerance_m:
          type: number
          minimum: 0
        cameras:
          type: array
          items:
            type: object
            required:
            - camera_id
            - vcl_channel_id
            properties:
              camera_id:
                type: string
                minLength: 1
              vcl_channel_id:
                type: string
                nullable: true
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/SiteAnnotation'
    SiteAnnotation:
      type: object
      required:
      - annotation_id
      - source_scene_id
      - name
      - kind_id
      - role
      - shape
      - points
      - visible
      - camera_id
      properties:
        annotation_id:
          type: string
          minLength: 1
        source_scene_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        kind_id:
          type: string
          minLength: 1
        role:
          type: string
          enum:
          - CAMERA
          - LANDMARK
          - BARRIER
          - ROUTE_CANDIDATE
        shape:
          type: string
          enum:
          - point
          - polyline
          - polygon
        points:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SiteXYZ'
          description: Absolute coordinates in the declared local frame. Point has one vertex; polyline needs two; polygon
            needs three.
        visible:
          type: boolean
        camera_id:
          type: string
          description: Empty means no explicit device binding.
    SiteXYZ:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: number
    SiteCameraContextRequest:
      type: object
      required:
      - scene_version
      - camera_ref
      - id_namespace
      - radius_m
      properties:
        scene_version:
          type: string
          minLength: 1
        camera_ref:
          type: string
          minLength: 1
        id_namespace:
          type: string
          enum:
          - CAMERA_ID
          - VCL_CHANNEL_ID
        radius_m:
          type: number
          minimum: 0
    SiteCameraContextReply:
      type: object
      required:
      - ok
      - context
      properties:
        ok:
          type: boolean
        context:
          type: object
          required:
          - scene_version
          - status
          - candidate_markers
          - person_position_observed
          - navigation_verified
          properties:
            scene_version:
              type: string
            camera_id:
              type: string
            status:
              type: string
              enum:
              - UNKNOWN_CAMERA
              - AMBIGUOUS_DEVICE
              - NO_PUBLISHED_CAMERA_MARKER
              - AMBIGUOUS_POSITION
              - BOUND_MARKER
            person_position_observed:
              type: boolean
              enum:
              - false
            navigation_verified:
              type: boolean
              enum:
              - false
            max_marker_separation_m:
              type: number
              minimum: 0
            candidate_markers:
              type: array
              items:
                allOf:
                - $ref: '#/components/schemas/SiteAnnotation'
                - type: object
                  properties:
                    local_xyz:
                      $ref: '#/components/schemas/SiteXYZ'
                    world_ecef_xyz:
                      $ref: '#/components/schemas/SiteXYZ'
                    nearby_annotations:
                      type: array
                      items:
                        allOf:
                        - $ref: '#/components/schemas/SiteAnnotation'
                        - type: object
                          properties:
                            distance_to_geometry_m:
                              type: number
                              minimum: 0
                            nearest_local_xyz:
                              $ref: '#/components/schemas/SiteXYZ'
    FaceTemplateRequest:
      type: object
      required:
      - template_id
      - person_entity_id
      - feature_space
      - embedding
      properties:
        template_id:
          type: string
          minLength: 1
        person_entity_id:
          type: string
          minLength: 1
        feature_space:
          $ref: '#/components/schemas/FeatureSpaceContract'
        embedding:
          type: array
          minItems: 512
          maxItems: 512
          items:
            type: number
            format: float
    GalleryReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - gallery_version
        properties:
          gallery_version:
            type: integer
            format: int64
    FaceObservation:
      type: object
      description: One camera face crop with a compatible existing 512D extractor result. observation_id is globally unique
        across sources and immutable. frame_id names the original source frame, shared by its different face detections. This
        endpoint does not decode images/video or run extraction.
      required:
      - observation_id
      - source_id
      - camera_id
      - frame_id
      - captured_at_unix_ms
      - clock_uncertainty_ms
      - time_source
      - clock_domain
      - feature_space
      - embedding
      - detection_score
      - face_size_px
      properties:
        observation_id:
          type: string
          minLength: 1
        source_id:
          type: string
          minLength: 1
        camera_id:
          type: string
          minLength: 1
        frame_id:
          type: string
          minLength: 1
        captured_at_unix_ms:
          type: integer
          format: int64
        clock_uncertainty_ms:
          type: integer
          format: int64
          description: Negative means unavailable and yields UNASSIGNED; never guess zero.
        time_source:
          type: string
          enum:
          - UTC_CAPTURE
          - MEDIA_OFFSET
          - RECEIVED_AT
          - UNKNOWN
        clock_domain:
          type: string
          minLength: 1
        feature_space:
          $ref: '#/components/schemas/FeatureSpaceContract'
        embedding:
          type: array
          minItems: 512
          maxItems: 512
          items:
            type: number
            format: float
          description: Finite nonzero vector; normalized by the shared gallery.
        detection_score:
          type: number
          minimum: 0
          maximum: 1
        face_size_px:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Minimum side length of the detected face bounding box in original-frame pixels.
        local_track_id:
          type: string
        track_session_id:
          type: string
          description: Required together with a nonempty local_track_id. Change on tracker restart or ID recycling. Namespace
            is source_id + camera_id + session + local ID. A local track never proves cross-camera identity by itself.
        reentry_evidence_id:
          type: string
    AssociationPolicy:
      type: object
      description: Thresholds are explicit deployment inputs and require validation on the actual model/camera samples. No
        universal identity threshold or probability is implied. Require new_target_threshold < match_threshold <= template_update_threshold
        <= max_template_similarity. Reusing policy_id with changed values is rejected.
      required:
      - policy_id
      - match_threshold
      - new_target_threshold
      - min_margin
      - template_update_threshold
      - max_template_similarity
      properties:
        policy_id:
          type: string
          minLength: 1
        match_threshold:
          type: number
          minimum: 0
          maximum: 1
        new_target_threshold:
          type: number
          minimum: 0
          maximum: 1
          description: Create an anonymous target only if all visual person scores are strictly below this value.
        min_margin:
          type: number
          minimum: 0
          maximum: 2
          description: Difference between best and second camera-feasible person scores; all people in the space participate.
        template_update_threshold:
          type: number
          minimum: 0
          maximum: 1
        max_template_similarity:
          type: number
          minimum: 0
          maximum: 1
          description: Strict upper bound for automatic template addition, preventing near duplicates.
        min_detection_score:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        min_face_size_px:
          type: number
          minimum: 0
          exclusiveMinimum: true
          default: 32
        max_clock_uncertainty_ms:
          type: integer
          format: int64
          minimum: 0
          default: 1000
        max_templates_per_target:
          type: integer
          minimum: 1
          default: 8
          description: Cap on association-owned templates; externally enrolled templates are managed separately.
        require_topology:
          type: boolean
          default: false
          description: Leave a visually matched identity PROVISIONAL if its cross-camera constraints are UNKNOWN.
        topology_is_complete:
          type: boolean
          default: false
          description: Set true only for verified complete directed connectivity, minimum times, opening windows and camera
            overlap. Otherwise an absent feasible path is UNKNOWN rather than hard identity exclusion. Missing camera coverage
            is always UNKNOWN. This is a caller assertion, not an algorithm completeness check.
        overlapping_cameras:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              minLength: 1
          description: Unordered camera pairs with verified overlapping observation regions.
    AssociationObserveRequest:
      type: object
      required:
      - observation
      - policy
      - graph
      properties:
        observation:
          $ref: '#/components/schemas/FaceObservation'
        policy:
          $ref: '#/components/schemas/AssociationPolicy'
        graph:
          $ref: '#/components/schemas/CameraGraph'
        reconsider:
          type: boolean
          default: false
          description: Reevaluate a previously unassigned observation; confirmed assignments require explicit correction.
    AssociationCorrectRequest:
      type: object
      required:
      - observation_id
      - target_id
      - evidence_id
      properties:
        observation_id:
          type: string
          minLength: 1
        target_id:
          type: string
          minLength: 1
        evidence_id:
          type: string
          minLength: 1
          description: Reference to independent verified attribution; the algorithm cannot inspect external evidence.
    AssociationRebuildRequest:
      type: object
      required:
      - target_id
      - reason
      - graph
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: 'Optimistic precondition: 0 for creation; current trajectory version for a changed rebuild. Omission
            on an existing changed target returns 409. An identical current-input retry may use an older expected version.'
        target_id:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        graph:
          $ref: '#/components/schemas/CameraGraph'
        options:
          $ref: '#/components/schemas/TrajectoryOptions'
    AssociationCandidate:
      type: object
      required:
      - target_id
      - template_id
      - similarity
      - camera_compatibility
      properties:
        target_id:
          type: string
        template_id:
          type: string
        similarity:
          type: number
          description: Cosine score, not identity probability.
        camera_compatibility:
          type: string
          enum:
          - COMPATIBLE
          - UNKNOWN
          - CONFLICT
    AssociationResult:
      type: object
      required:
      - observation_id
      - decision
      - reason
      - version
      - policy_id
      - graph_version
      - target_id
      - sighting
      - candidates
      - affected_target_ids
      - template_added
      properties:
        trajectory_effects:
          type: array
          items:
            $ref: '#/components/schemas/AssociationTrajectoryEffect'
        observation_id:
          type: string
        decision:
          type: string
          enum:
          - CREATED
          - MATCHED
          - PROVISIONAL
          - CONFLICT
          - UNASSIGNED
          - CORRECTED
        reason:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
          description: Global association mutation sequence; distinct from trajectory version.
        policy_id:
          type: string
        graph_version:
          type: string
        target_id:
          type: string
          nullable: true
        sighting:
          oneOf:
          - $ref: '#/components/schemas/Sighting'
          - type: object
            nullable: true
            enum:
            - null
        candidates:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AssociationCandidate'
          description: Visual Top8 plus decision-relevant feasible leaders if outside Top8. A proven lower-score bound can
            replace further history checks. Correction retains original candidates.
        remaining_similarity_upper_bound:
          type: number
          format: float
          nullable: true
          description: Exact gallery score upper bound for unclassified lower candidates when sufficient to prove the decision.
            Not a measured runner-up or identity probability.
        affected_target_ids:
          type: array
          items:
            type: string
        template_added:
          type: boolean
          description: Whether this decision added a managed template; exact retries return the original flag.
    AssociationReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - association
        - gallery_version
        properties:
          association:
            $ref: '#/components/schemas/AssociationResult'
          gallery_version:
            type: integer
            format: int64
    FeatureSpaceContract:
      type: object
      description: The query and templates must use the same model and preprocessing contract. Detector hash and profile must
        either both be populated or both be empty for externally aligned faces. Equal embedding dimensions alone do not imply
        compatibility.
      required:
      - recognition_model_sha256
      - alignment_version
      - preprocessing_version
      - output_version
      properties:
        recognition_model_sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        detector_model_sha256:
          type: string
          pattern: ^([a-fA-F0-9]{64})?$
        detector_profile:
          type: string
        alignment_version:
          type: string
          minLength: 1
        preprocessing_version:
          type: string
          minLength: 1
        output_version:
          type: string
          minLength: 1
    PersonSearchRequest:
      type: object
      required:
      - feature_space
      - embedding
      - top_k
      properties:
        feature_space:
          $ref: '#/components/schemas/FeatureSpaceContract'
        embedding:
          type: array
          minItems: 512
          maxItems: 512
          items:
            type: number
            format: float
          description: Finite nonzero 512D vector; normalized by the existing gallery.
        top_k:
          type: integer
          minimum: 1
          maximum: 100
    PersonCandidate:
      type: object
      required:
      - person_entity_id
      - template_id
      - similarity
      properties:
        person_entity_id:
          type: string
        template_id:
          type: string
        similarity:
          type: number
          format: float
          description: Cosine similarity; candidate score rather than identity probability.
    PersonSearchReply:
      allOf:
      - $ref: '#/components/schemas/AlgorithmReply'
      - type: object
        required:
        - hits
        - gallery_version
        properties:
          hits:
            type: array
            items:
              $ref: '#/components/schemas/PersonCandidate'
          gallery_version:
            type: integer
            format: int64
    Sighting:
      type: object
      required:
      - observation_id
      - target_id
      - camera_id
      - attribution_evidence_id
      - captured_at_unix_ms
      - clock_uncertainty_ms
      - link_status
      - time_source
      - source_id
      - clock_domain
      properties:
        observation_id:
          type: string
        target_id:
          type: string
        camera_id:
          type: string
        attribution_evidence_id:
          type: string
        captured_at_unix_ms:
          type: integer
          format: int64
          description: UTC capture time in milliseconds.
        clock_uncertainty_ms:
          type: integer
          format: int64
          minimum: 0
        link_status:
          type: string
          enum:
          - CONFIRMED
          - PROVISIONAL
          - UNASSIGNED
          - CONFLICT
        time_source:
          type: string
          enum:
          - UTC_CAPTURE
          - MEDIA_OFFSET
          - RECEIVED_AT
          - UNKNOWN
        source_id:
          type: string
        clock_domain:
          type: string
          example: UTC
        reentry_evidence_id:
          type: string
    CameraEdge:
      type: object
      required:
      - edge_id
      - from_camera
      - to_camera
      - min_travel_ms
      - max_travel_ms
      - cost
      properties:
        edge_id:
          type: string
          description: Stable directed topology edge ID used by the versioned geometry binding endpoint.
        from_camera:
          type: string
        to_camera:
          type: string
        min_travel_ms:
          type: integer
          format: int64
          minimum: 0
        max_travel_ms:
          type: integer
          format: int64
          minimum: 0
          description: Soft travel-time scoring reference; waiting is allowed.
        cost:
          type: number
          format: double
          minimum: 0
        open_from_unix_ms:
          type: integer
          format: int64
        open_until_unix_ms:
          type: integer
          format: int64
    CameraGraph:
      type: object
      required:
      - version
      - edges
      properties:
        version:
          type: string
        edges:
          type: array
          items:
            $ref: '#/components/schemas/CameraEdge'
    TrajectoryOptions:
      type: object
      properties:
        max_visit_gap_ms:
          type: integer
          format: int64
          minimum: 0
          default: 30000
        max_clock_uncertainty_ms:
          type: integer
          format: int64
          minimum: 0
          default: 1000
        session_gap_ms:
          type: integer
          format: int64
          minimum: 0
          default: 3600000
        max_hops:
          type: integer
          minimum: 1
          default: 8
        max_expansions:
          type: integer
          minimum: 1
          default: 10000
        max_candidates:
          type: integer
          minimum: 1
          default: 8
        backup_score_margin:
          type: number
          format: double
          minimum: 0
          default: 1
        travel_time_weight_per_second:
          type: number
          format: double
          minimum: 0
          default: 0
        non_overlapping_cameras:
          type: array
          description: Verified disjoint observation-region pairs. Empty means unknown. A strictly intervening capture can
            split a visit and is retained as boundary_observation_id.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: string
              minLength: 1
    RebuildRequest:
      type: object
      required:
      - target_id
      - reason
      - sightings
      - graph
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
          description: 'Optimistic precondition: 0 for creation; current trajectory version for a changed rebuild. Omission
            on an existing changed target returns 409. An identical current-input retry may use an older expected version.'
        target_id:
          type: string
        reason:
          type: string
        sightings:
          type: array
          items:
            $ref: '#/components/schemas/Sighting'
        graph:
          $ref: '#/components/schemas/CameraGraph'
        options:
          $ref: '#/components/schemas/TrajectoryOptions'
    GetRequest:
      type: object
      required:
      - target_id
      properties:
        target_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
          default: 0
    TimelineRequest:
      type: object
      required:
      - target_id
      - at_unix_ms
      properties:
        target_id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
          default: 0
        at_unix_ms:
          type: integer
          format: int64
        from_unix_ms:
          type: integer
          format: int64
        to_unix_ms:
          type: integer
          format: int64
    CaptureTimeBounds:
      type: object
      description: Bounds of actual first and last capture times over all accepted observations. Middle captures can extend
        the envelope. Nominal endpoint error fields remain the errors of those endpoint captures and must not substitute for
        this envelope.
      required:
      - first_earliest_unix_ms
      - first_latest_unix_ms
      - last_earliest_unix_ms
      - last_latest_unix_ms
      properties:
        first_earliest_unix_ms:
          type: integer
          format: int64
        first_latest_unix_ms:
          type: integer
          format: int64
        last_earliest_unix_ms:
          type: integer
          format: int64
        last_latest_unix_ms:
          type: integer
          format: int64
    ObservedInterval:
      type: object
      required:
      - first_seen_unix_ms
      - last_seen_unix_ms
      - first_seen_clock_uncertainty_ms
      - last_seen_clock_uncertainty_ms
      - time_bounds
      properties:
        first_seen_unix_ms:
          type: integer
          format: int64
        last_seen_unix_ms:
          type: integer
          format: int64
        first_seen_clock_uncertainty_ms:
          type: integer
          format: int64
        last_seen_clock_uncertainty_ms:
          type: integer
          format: int64
        time_bounds:
          $ref: '#/components/schemas/CaptureTimeBounds'
    Anchor:
      allOf:
      - $ref: '#/components/schemas/ObservedInterval'
      - type: object
        required:
        - anchor_id
        - visit_id
        - camera_id
        properties:
          anchor_id:
            type: string
          visit_id:
            type: string
          camera_id:
            type: string
    CameraVisit:
      allOf:
      - $ref: '#/components/schemas/ObservedInterval'
      - type: object
        required:
        - visit_id
        - target_id
        - camera_id
        - observation_ids
        properties:
          visit_id:
            type: string
          target_id:
            type: string
          camera_id:
            type: string
          max_clock_uncertainty_ms:
            type: integer
            format: int64
          observation_ids:
            type: array
            items:
              type: string
          attribution_evidence_ids:
            type: array
            items:
              type: string
          source_ids:
            type: array
            items:
              type: string
          reentry_evidence_ids:
            type: array
            items:
              type: string
          boundary_observation_id:
            type: string
            description: Intervening confirmed capture that proves a return through a verified disjoint region; empty when
              unavailable.
    TrajectorySession:
      allOf:
      - $ref: '#/components/schemas/ObservedInterval'
      - type: object
        required:
        - session_id
        - anchor_ids
        - segment_ids
        properties:
          session_id:
            type: string
          anchor_ids:
            type: array
            items:
              type: string
          segment_ids:
            type: array
            items:
              type: string
    NodeStatus:
      type: string
      enum:
      - OBSERVED
      - INFERRED
      - UNKNOWN
    PathNode:
      type: object
      description: Possible time envelope conditional on this candidate route. A time inside the envelope is not a precise
        position or a claim of continuous presence.
      required:
      - camera_id
      - status
      - earliest_unix_ms
      - latest_unix_ms
      properties:
        camera_id:
          type: string
        status:
          $ref: '#/components/schemas/NodeStatus'
        earliest_unix_ms:
          type: integer
          format: int64
        latest_unix_ms:
          type: integer
          format: int64
    PathTimeRange:
      type: object
      required:
      - earliest_unix_ms
      - latest_unix_ms
      properties:
        earliest_unix_ms:
          type: integer
          format: int64
        latest_unix_ms:
          type: integer
          format: int64
    PathCandidate:
      type: object
      required:
      - nodes
      - edge_ids
      - edge_time_bounds
      - score
      - edge_cost
      - time_penalty
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PathNode'
        edge_ids:
          type: array
          items:
            type: string
          description: Ordered directed passage IDs; edge_ids[i] connects nodes[i] and nodes[i+1]. Bind these IDs to traversable
            3D navigation geometry when it is supplied.
        edge_time_bounds:
          type: array
          items:
            $ref: '#/components/schemas/PathTimeRange'
          description: Possible passage occupancy envelopes conditional on this candidate route; bounds[i] belongs to edge_ids[i].
            Includes permitted travel slack, but starts no earlier than the edge departure opening time. These bounds do not
            imply a speed, precise position or observed presence.
        score:
          type: number
          format: double
          description: Ranking score, not a probability.
        edge_cost:
          type: number
          format: double
        time_penalty:
          type: number
          format: double
    NullablePathCandidate:
      type: object
      nullable: true
      required: [nodes, edge_ids, edge_time_bounds, score, edge_cost, time_penalty]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/PathNode'
        edge_ids:
          type: array
          items:
            type: string
        edge_time_bounds:
          type: array
          items:
            $ref: '#/components/schemas/PathTimeRange'
        score:
          type: number
          format: double
        edge_cost:
          type: number
          format: double
        time_penalty:
          type: number
          format: double
    TrajectorySegment:
      type: object
      description: from/to times delimit the possible interval. A route is selected only when it is feasible between the latest
        possible departure capture and earliest possible arrival capture. UNKNOWN can mean insufficient conservative time,
        ambiguous ordering, or no route; it does not prove physical impossibility.
      required:
      - segment_id
      - graph_version
      - from_anchor_id
      - to_anchor_id
      - from_unix_ms
      - to_unix_ms
      - status
      - search_complete
      - unique_path
      - primary
      - backups
      properties:
        segment_id:
          type: string
        graph_version:
          type: string
        from_anchor_id:
          type: string
        to_anchor_id:
          type: string
        from_unix_ms:
          type: integer
          format: int64
        to_unix_ms:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/NodeStatus'
        search_complete:
          type: boolean
        unique_path:
          type: boolean
          description: Unique among conservatively feasible bounded simple paths when search is complete.
        primary:
          $ref: '#/components/schemas/NullablePathCandidate'
        backups:
          type: array
          items:
            $ref: '#/components/schemas/PathCandidate'
    TrajectoryRevision:
      type: object
      required:
      - target_id
      - previous_version
      - version
      - reason
      - affected_segment_ids
      properties:
        target_id:
          type: string
        previous_version:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        reason:
          type: string
        affected_segment_ids:
          type: array
          items:
            type: string
    TrajectorySnapshot:
      type: object
      required:
      - target_id
      - version
      - graph
      - options
      - evidence
      - visits
      - anchors
      - sessions
      - segments
      - revision
      - rejected_observation_ids
      properties:
        association_revision:
          type: integer
          format: int64
          minimum: 0
        freshness:
          $ref: '#/components/schemas/TrajectoryFreshness'
        target_id:
          type: string
        version:
          type: integer
          format: int64
        graph_version:
          type: string
        graph:
          $ref: '#/components/schemas/CameraGraph'
        options:
          $ref: '#/components/schemas/TrajectoryOptions'
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Sighting'
        visits:
          type: array
          items:
            $ref: '#/components/schemas/CameraVisit'
        anchors:
          type: array
          items:
            $ref: '#/components/schemas/Anchor'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TrajectorySession'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TrajectorySegment'
        revision:
          $ref: '#/components/schemas/TrajectoryRevision'
        rejected_observation_ids:
          type: array
          items:
            type: string
    TimelineObservation:
      type: object
      required:
      - anchor_id
      - observation
      properties:
        anchor_id:
          type: string
        observation:
          $ref: '#/components/schemas/Sighting'
    TimelinePathLocation:
      type: object
      required:
      - segment_id
      - route_index
      - node_indices
      - edge_indices
      properties:
        segment_id:
          type: string
        route_index:
          type: integer
          minimum: 0
          description: 0 selects primary; n > 0 selects backups[n-1] in the matching segment.
        node_indices:
          type: array
          items:
            type: integer
            minimum: 0
          description: Zero-based candidate node indices whose passage bounds contain the query time.
        edge_indices:
          type: array
          items:
            type: integer
            minimum: 0
          description: Zero-based candidate edge indices whose occupancy bounds contain the query time.
    Timeline:
      type: object
      description: OBSERVED requires a capture with nominal timestamp equal to the query. This is direct capture evidence
        with its stated clock uncertainty, not zero-error positioning. Clock-only overlap of individual captures returns possible
        anchor IDs with UNKNOWN status. Unobserved Visit interiors do not establish possible capture evidence. Range anchors
        use full capture envelopes. Previous/next anchors follow actual nominal captures, including captures inside an extended
        Visit; these are not uncertainty-order claims. Previous observation is at or before the query time; next is strictly
        after. Simultaneous captures use deterministic observation ID order. Evidence belongs to the requested immutable snapshot.
        Path locations enumerate possibilities for each retained candidate, not probabilities or exact coordinates. Multiple
        active segments or a gap before a passage opens remain UNKNOWN unless a direct capture establishes OBSERVED evidence.
      required:
      - target_id
      - version
      - at_unix_ms
      - status
      - observed_anchor_ids
      - possible_observed_anchor_ids
      - previous_anchor_id
      - next_anchor_id
      - segment_id
      - anchors_in_range
      - segments_in_range
      - previous_observation
      - next_observation
      - active_segment_ids
      - path_locations
      properties:
        freshness:
          $ref: '#/components/schemas/TrajectoryFreshness'
        target_id:
          type: string
        version:
          type: integer
          format: int64
        at_unix_ms:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/NodeStatus'
        observed_anchor_ids:
          type: array
          items:
            type: string
        possible_observed_anchor_ids:
          type: array
          items:
            type: string
        previous_anchor_id:
          type: string
          nullable: true
        next_anchor_id:
          type: string
          nullable: true
        previous_observation:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/TimelineObservation'
        next_observation:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/TimelineObservation'
        segment_id:
          type: string
          nullable: true
          description: Set only when exactly one segment covers the query time; otherwise null.
        active_segment_ids:
          type: array
          items:
            type: string
          description: All segments covering the query time, including UNKNOWN segments.
        path_locations:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePathLocation'
          description: Possible node and passage indices for each retained primary or backup route at the query time. Resolve
            segment_id within segments_in_range. An empty result does not establish a physical position.
        anchors_in_range:
          type: array
          items:
            $ref: '#/components/schemas/Anchor'
        segments_in_range:
          type: array
          items:
            $ref: '#/components/schemas/TrajectorySegment'
    Point3D:
      type: array
      minItems: 3
      maxItems: 3
      items:
        type: number
        format: double
    GeometryEdge:
      type: object
      required:
      - edge_id
      - from_camera
      - to_camera
      - points
      properties:
        edge_id:
          type: string
          minLength: 1
        from_camera:
          type: string
          minLength: 1
        to_camera:
          type: string
          minLength: 1
        points:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Point3D'
    GeometryModel:
      type: object
      required:
      - geometry_version
      - graph_version
      - coordinate_frame
      - unit
      - join_tolerance
      - edges
      properties:
        geometry_version:
          type: string
          minLength: 1
        graph_version:
          type: string
          minLength: 1
        coordinate_frame:
          type: string
          minLength: 1
        unit:
          type: string
          enum:
          - m
          - cm
          - mm
        join_tolerance:
          type: number
          format: double
          minimum: 0
          description: Explicit maximum route-join distance in the stated coordinate unit.
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GeometryEdge'
    GeometryRoute:
      type: object
      required:
      - route_index
      - status
      - conditional_on_route
      - polyline
      - edges
      - missing_edge_ids
      properties:
        route_index:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - AVAILABLE_INFERRED
          - MISSING_GEOMETRY
          - DISCONTINUOUS_GEOMETRY
        conditional_on_route:
          type: boolean
          enum:
          - true
        polyline:
          type: array
          items:
            $ref: '#/components/schemas/Point3D'
        missing_edge_ids:
          type: array
          items:
