[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "venue-face-engine"
version = "0.1.0"
description = "Batch face recognition engine for venue security"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
runtime = ["opencv-python-headless>=4.8", "onnxruntime-gpu>=1.17", "faiss-cpu>=1.8"]
preview = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
